# Puertos solo en 127.0.0.1. Imágenes fijadas (tags comprobados en Docker Hub el 2026-11-25).
# alertmanager.rendered.yml se genera con: python3 scripts/render-alertmanager.py
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${AGSGPT_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_metrics
    tmpfs:
      - /tmp/prometheus_metrics
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.35.1
    volumes:
      - ../monitoring/alertmanager.rendered.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../monitoring/secrets/smtp_password:/etc/alertmanager/secrets/smtp_password:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Define GRAFANA_PASSWORD en .env}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
