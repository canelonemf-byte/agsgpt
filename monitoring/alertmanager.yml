global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "canelone.mf@gmail.com"
  smtp_auth_username: "canelone.mf@gmail.com"
  smtp_auth_identity: "canelone.mf@gmail.com"
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: email-default
  group_by: [alertname, provider, job]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity = "critical"
      receiver: email-critical
      repeat_interval: 15m

receivers:
  - name: email-default
    email_configs:
      - to: "canelone.mf@gmail.com"
        send_resolved: true
        headers:
          Subject: "[{{ .Status | toUpper }}] agsgpt · {{ .CommonLabels.alertname }}"

  - name: email-critical
    email_configs:
      - to: "canelone.mf@gmail.com"
        send_resolved: true
        headers:
          Subject: "CRITICAL · agsgpt · {{ .CommonLabels.alertname }}"
